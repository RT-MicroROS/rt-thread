name: Auto Review Assistant

on:
  pull_request_target:
    branches: [ master ]
    types: [opened, synchronize, reopened]

jobs:
  assign-reviewers:
    runs-on: ubuntu-22.04
    permissions:
      issues: read
      pull-requests: write
      contents: read
    steps:
      - name: Extract PR number
        id: extract-pr
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "PR_NUMBER=${PR_NUMBER}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: MAINTAINERS
          persist-credentials: false

      - name: Setup environment
        run: |
          mkdir -p tmp
          touch tmp/changed_files.txt tmp/tag_data.csv tmp/triggered_reviewers.txt \
                tmp/triggered_tags.txt tmp/unique_reviewers.txt tmp/unique_tags.txt \
                tmp/tag_files_map.json tmp/review_status.md tmp/review_data.md

      - name: Get changed files
        id: changed_files
        run: |
          changed_files=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ steps.extract-pr.outputs.PR_NUMBER }}/files" | \
            jq -r '.[].filename')
          echo "$changed_files" > tmp/changed_files.txt
          
          # Get existing comment time if available
          existing_comment=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.extract-pr.outputs.PR_NUMBER }}/comments" | \
            jq -r '.[] | select(.user.login == "github-actions[bot]") | .body' | head -1)
          
          if [[ -n "$existing_comment" ]]; then
            comment_time=$(echo "$existing_comment" | grep -oP "Last Updated: \K[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} UTC")
            if [[ -n "$comment_time" ]]; then
              timestamp=$(date -d "$comment_time" +%s)
              echo "COMMENT_TIME=${timestamp}" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Parse MAINTAINERS file
        id: parse_maintainer
        run: |
          awk '
            BEGIN{ tag=""; paths=""; owners="" }
            /^tag:/ { 
                tag = substr($0, index($0, $2)); 
                paths=""; owners=""
            }
            /^path:/ {
                path = substr($0, index($0, $2))
                gsub(/^[ \t]+|[ \t]+$/, "", path)
                paths = (paths == "" ? path : paths "|" path)
            }
            /^owners:/ {
                owners = substr($0, index($0, $2))
                n = split(owners, parts, /[()]/)
                github_ids=""
                for (i=2; i<=n; i+=2) {
                  id=parts[i]
                  gsub(/^[ \t@]+|[ \t]+$/, "", id)
                  if(id != "") github_ids=github_ids "@" id " "
                }
                print tag "|" paths "|" github_ids
                tag=""; paths=""; owners=""
            }
          ' MAINTAINERS > tmp/tag_data.csv

      - name: Generate reviewers list and tag-file mapping
        id: generate_reviewers
        run: |
          # Clean up files
          > tmp/triggered_reviewers.txt
          > tmp/triggered_tags.txt
          > tmp/unique_reviewers.txt
          > tmp/unique_tags.txt
          echo "{}" > tmp/tag_files_map.json

          # Read tag data
          declare -A tag_paths_map
          declare -A tag_reviewers_map
          while IFS='|' read -r tag paths reviewers; do
            # Clean up paths and reviewers
            paths=$(echo "$paths" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            reviewers=$(echo "$reviewers" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            
            # Store paths and reviewers
            tag_paths_map["$tag"]="$paths"
            tag_reviewers_map["$tag"]="$reviewers"
          done < tmp/tag_data.csv

          # Process changed files
          while IFS= read -r changed_file; do
            [[ -z "$changed_file" ]] && continue
            
            for tag in "${!tag_paths_map[@]}"; do
              IFS='|' read -ra paths <<< "${tag_paths_map[$tag]}"
              
              for path in "${paths[@]}"; do
                [[ -z "$path" ]] && continue
                
                if [[ -f "$path" ]]; then
                  # Exact file match
                  if [[ "$changed_file" == "$path" ]]; then
                    echo "${tag_reviewers_map[$tag]}" | tr ' ' '\n' | grep -v '^$' >> tmp/triggered_reviewers.txt
                    echo "$tag" >> tmp/triggered_tags.txt
                    
                    # Update tag_files_map.json
                    jq --arg tag "$tag" --arg file "$changed_file" \
                      'if .[$tag] then .[$tag] += [$file] else .[$tag] = [$file] end' \
                      tmp/tag_files_map.json > tmp/tmp_map.json && mv tmp/tmp_map.json tmp/tag_files_map.json
                    break
                  fi
                else
                  # Directory prefix match
                  if [[ "$changed_file" == "$path"* ]]; then
                    echo "${tag_reviewers_map[$tag]}" | tr ' ' '\n' | grep -v '^$' >> tmp/triggered_reviewers.txt
                    echo "$tag" >> tmp/triggered_tags.txt
                    
                    # Update tag_files_map.json
                    jq --arg tag "$tag" --arg file "$changed_file" \
                      'if .[$tag] then .[$tag] += [$file] else .[$tag] = [$file] end' \
                      tmp/tag_files_map.json > tmp/tmp_map.json && mv tmp/tmp_map.json tmp/tag_files_map.json
                    break
                  fi
                fi
              done
            done
          done < tmp/changed_files.txt

          # Create unique lists
          sort -u tmp/triggered_reviewers.txt > tmp/unique_reviewers.txt
          sort -u tmp/triggered_tags.txt > tmp/unique_tags.txt

          # Set output variables
          if [[ -s tmp/unique_reviewers.txt ]]; then
            echo "HAS_REVIEWERS=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_REVIEWERS=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore Reviewers Cache
        id: reviewers-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            tmp/unique_tags_bak.txt
            tmp/unique_reviewers_bak.txt
          key: ${{ runner.os }}-auto-assign-reviewers-${{ steps.extract-pr.outputs.PR_NUMBER }}-${{ steps.changed_files.outputs.COMMENT_TIME || 'initial' }}

      - name: Get approval status
        id: get_approval
        run: |
          current_time=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "CURRENT_TIME=${current_time}" >> $GITHUB_OUTPUT

          # Get all comments
          comments=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.extract-pr.outputs.PR_NUMBER }}/comments")

          # Get notified users from cache if available
          notified_users=()
          if [[ -f "tmp/unique_reviewers_bak.txt" ]]; then
            mapfile -t notified_users < "tmp/unique_reviewers_bak.txt"
          fi

          # Process approvals
          {
            echo "---"
            echo "### 📊 Current Review Status (Last Updated: $current_time)"
            
            while read -r reviewer; do
              [[ -z "$reviewer" ]] && continue
              
              # Check if reviewer has approved
              approved=$(echo "$comments" | jq -r \
                ".[] | select(.user.login == \"${reviewer#@}\" and (.body | test(\"^\\\\s*LGTM\\\\s*$\"; \"i\"))) | .created_at" | head -1)
              
              # Check if reviewer was notified
              is_notified="false"
              for user in "${notified_users[@]}"; do
                if [[ "$user" == "$reviewer" ]]; then
                  is_notified="true"
                  break
                fi
              done

              if [[ -n "$approved" ]]; then
                timestamp=$(date -d "$approved" -u +"%Y-%m-%d %H:%M UTC")
                echo "- ✅ **${reviewer}** Reviewed On $timestamp"
              else
                if [[ "$is_notified" == "true" ]]; then
                  echo "- ⌛ **${reviewer}** (Notified) Pending Review"
                else
                  echo "- ⌛ **${reviewer}** Pending Review"
                fi
              fi
            done < tmp/unique_reviewers.txt
          } > tmp/review_status.md

      - name: Generate review data
        id: generate_review
        if: steps.generate_reviewers.outputs.HAS_REVIEWERS == 'true'
        run: |
          current_time="${{ steps.get_approval.outputs.CURRENT_TIME }}"
          
          {
            echo "## 📌 Code Review Assignment"
            echo ""
            
            # Process each unique tag
            while read -r tag; do
              [[ -z "$tag" ]] && continue
              
              # Get reviewers for this tag
              reviewers=$(grep -F "$tag" tmp/tag_data.csv | cut -d'|' -f3 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              
              # Get changed files for this tag
              changed_files=$(jq -r --arg tag "$tag" '.[$tag] // [] | join("\n- ")' tmp/tag_files_map.json)
              
              echo "### 🏷️ Tag: $tag"
              echo ""
              echo "**Reviewers:** $reviewers"
              echo "<details>"
              echo "<summary><b>Changed Files</b> (Click to expand)</summary>"
              echo ""
              if [[ -n "$changed_files" ]]; then
                echo "- $changed_files"
              else
                echo "No changed files found for this tag."
              fi
              echo ""
              echo "</details>"
              echo ""
            done < tmp/unique_tags.txt
            
            cat tmp/review_status.md
            echo "---"
            echo "### 📝 Review Instructions"
            echo ""
            echo "1. **维护者可以通过单击此处来刷新审查状态:** [🔄 刷新状态](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "   **Maintainers can refresh the review status by clicking here:** [🔄 Refresh Status](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "2. **确认审核通过后评论 \`LGTM/lgtm\`**"
            echo "   **Comment \`LGTM/lgtm\` after confirming approval**"
            echo ""
            echo "3. **PR合并前需至少一位维护者确认**"
            echo "   **PR must be confirmed by at least one maintainer before merging**"
            echo ""
            echo "> ℹ️ **刷新CI状态操作需要具备仓库写入权限。**"
            echo "> ℹ️ **Refresh CI status operation requires repository Write permission.**"
          } > tmp/review_data.md

      - name: Post/Update comment
        id: post_comment
        if: steps.generate_reviewers.outputs.HAS_REVIEWERS == 'true'
        run: |
          # Get existing comment ID if any
          comment_id=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.extract-pr.outputs.PR_NUMBER }}/comments" | \
            jq -r '.[] | select(.user.login == "github-actions[bot]") | .id' | head -1)

          if [[ -n "$comment_id" ]]; then
            # Update existing comment
            curl -s -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg body "$(cat tmp/review_data.md)" '{body: $body}')" \
              "https://api.github.com/repos/${{ github.repository }}/issues/comments/$comment_id" > /dev/null
          else
            # Create new comment
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg body "$(cat tmp/review_data.md)" '{body: $body}')" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.extract-pr.outputs.PR_NUMBER }}/comments" > /dev/null
          fi

          # Save current state to cache
          cp tmp/unique_reviewers.txt tmp/unique_reviewers_bak.txt
          cp tmp/unique_tags.txt tmp/unique_tags_bak.txt

      - name: Save Reviewers Cache
        id: reviewers-cache-save
        if: steps.generate_reviewers.outputs.HAS_REVIEWERS == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tmp/unique_tags_bak.txt
            tmp/unique_reviewers_bak.txt
          key: ${{ runner.os }}-auto-assign-reviewers-${{ steps.extract-pr.outputs.PR_NUMBER }}-${{ steps.changed_files.outputs.COMMENT_TIME || 'initial' }}

      - name: Clean up
        run: |
          rm -rf tmp
